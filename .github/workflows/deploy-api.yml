name: Deploy API to Hugging Face Spaces

# Publishes backend/ + data/ as a Docker Space after CI passes on main.
# Setup (once): create a Docker Space on huggingface.co, then in this GitHub repository add
#   secret   HF_TOKEN  – a Hugging Face access token with write access
#   variable HF_SPACE  – the Space id, e.g. "your-username/clauselens-api"
# Without them this workflow does nothing.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the Space
        run: |
          mkdir space
          cp -r backend data space/
          rm -rf space/backend/tests space/backend/storage
          # Source files for the public read-only demo (docs/Demo.md); the Dockerfile copies
          # these into the image. Only the three documents /demo offers, not the whole dataset.
          mkdir -p space/samples space/dataset/indiacode
          cp samples/employment_agreement.pdf samples/rental_agreement_with_mistakes.pdf space/samples/
          cp dataset/indiacode/consumer_protection_act_2019.pdf space/dataset/indiacode/
          cp backend/Dockerfile space/Dockerfile
          cp deploy/huggingface/README.md space/README.md
          printf '*.pdf filter=lfs diff=lfs merge=lfs -text\n' > space/.gitattributes
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git lfs install --local
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
