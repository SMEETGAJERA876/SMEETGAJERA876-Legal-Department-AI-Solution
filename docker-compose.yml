services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: clauselens
      POSTGRES_PASSWORD: clauselens
      POSTGRES_DB: clauselens
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clauselens"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
